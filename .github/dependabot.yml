version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/project-updater/assets/workflows"
      - "/python-updater/assets/workflows"
      - "/go-updater/assets/workflows"
      - "/js-updater/assets/workflows"
      - "/java-updater/assets/workflows"
      - "/flutter-updater/assets/workflows"
      - "/gcp-updater/assets/workflows"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 3
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
