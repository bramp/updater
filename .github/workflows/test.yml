name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install pyyaml yamllint

      - name: Validate skills, links, Makefiles, and SHA-pinned workflows
        run: make test-ci

      - name: Lint YAML templates
        run: |
          yamllint --strict -d "{extends: relaxed, rules: {line-length: {max: 140}}}" \
            .github/ \
            project-updater/assets/ \
            python-updater/assets/workflows/ \
            go-updater/assets/workflows/ \
            js-updater/assets/workflows/ \
            java-updater/assets/workflows/ \
            flutter-updater/assets/workflows/ \
            gcp-updater/assets/workflows/
