name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable squash auto-merge for cooled-down minor and patch updates
        if: >-
          steps.metadata.outputs.maintainer-changes != 'true' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${BASE_REF}" --jq '.[].type' | grep -qx 'required_status_checks'; then
            echo "::error::Branch '${BASE_REF}' lacks required_status_checks; apply ruleset-main.json before auto-merging."
            exit 1
          fi
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
