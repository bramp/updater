name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Use latest patched stable Go (not go-version-file: go.mod) so govulncheck
          # doesn't fail on older stdlib patch releases when new CVEs are fixed.
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run formatting, analysis, and race tests
        run: make test-ci
