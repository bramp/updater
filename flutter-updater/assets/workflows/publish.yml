name: Publish to pub.dev

on:
  push:
    tags:
      - "{PACKAGE_NAME}-v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref_name, '{PACKAGE_NAME}-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      working-directory: .
